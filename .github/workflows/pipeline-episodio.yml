name: Produção e revisão de episódio no Windows

on:
  pull_request:
    branches: [main, feat/motion-documental, feat/skills-producao]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar-episodio:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Instalar FFmpeg
        run: choco install ffmpeg --version=9.0.2 --yes --no-progress --limit-output
      - name: Preparar Python e voz local
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r requirements.txt
          Copy-Item config.example.json config.json
          New-Item -ItemType Directory -Force models | Out-Null
          python -m piper.download_voices --data-dir models pt_BR-faber-medium
      - name: Renderizar e refazer apenas a cena ou fala alterada
        run: python tests/verificar_episodio.py
      - name: Verificar revisão por versão e prévia do vídeo
        run: python -m unittest discover -s tests -p test_painel_revisao.py

  descobrir-skills:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Instalar Codex CLI
        run: npm install --global @openai/codex@0.167.1
      - name: Conferir as sete skills descobertas
        run: python3 tests/verificar_descoberta_skills.py
